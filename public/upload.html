<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload a mock-up · Mockup Containers</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🗂️</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">MC</span>
      <span>Mockup Containers</span>
    </a>
    <nav class="topbar-actions" id="nav"></nav>
  </header>

  <main class="page page-form">
    <div class="page-head">
      <h1>Upload a mock-up</h1>
      <p class="muted">A single <code>.html</code> file, or a <code>.zip</code> with your HTML, CSS, JS and assets. Max 50 MB.</p>
    </div>

    <form id="form" class="panel" novalidate>
      <div class="field">
        <label for="name">Project name</label>
        <input id="name" name="name" type="text" maxlength="120" placeholder="Checkout redesign" required>
      </div>

      <div class="field">
        <label for="description">Description <span class="muted">(optional)</span></label>
        <textarea id="description" name="description" maxlength="500" rows="3" placeholder="What is this mock-up for?"></textarea>
      </div>

      <div class="field">
        <label for="file">Design file</label>
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-controls="file">
          <input id="file" name="file" type="file" accept=".html,.htm,.zip,text/html,application/zip" hidden>
          <svg class="dropzone-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
          <p class="dropzone-text"><strong>Click to choose</strong> or drop your file here</p>
          <p class="muted dropzone-hint">.html or .zip</p>
        </div>
        <p id="file-picked" class="file-picked" hidden></p>
      </div>

      <p id="error" class="alert alert-error" hidden></p>
      <p id="success" class="alert alert-success" hidden></p>

      <div class="form-actions">
        <button id="submit" class="btn btn-primary" type="submit">Upload mock-up</button>
        <span id="progress" class="muted" hidden></span>
      </div>

      <p id="signed-in-as" class="muted form-foot" hidden></p>
    </form>
  </main>

  <script src="/js/session.js"></script>
  <script src="/js/file-picker.js"></script>
  <script src="/js/upload.js"></script>
</body>
</html>
